<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Статистика · Блокнот машиниста</title>
  <style>
    :root { color-scheme:dark; --bg:#07111f; --card:#0e1c2e; --card-strong:#10233a; --line:#1e334c; --text:#f4f7fb; --muted:#91a3b8; --accent:#5dd5ff; --ok:#64e6a7; --warn:#ffcb6b; --danger:#ff8b98; }
    * { box-sizing:border-box; }
    html { scrollbar-color:#28445f transparent; scrollbar-width:thin; }
    body { margin:0; background:radial-gradient(circle at 50% -20%,#102b4a 0,transparent 38%),linear-gradient(145deg,#07111f,#0a1730 55%,#07111f); color:var(--text); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; }
    main { width:min(1120px,calc(100% - 40px)); margin:0 auto; padding:28px 0 64px; }
    .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; }
    .back { color:var(--muted); text-decoration:none; font-size:14px; transition:color .2s; }
    .back:hover { color:var(--text); }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(30px,5vw,48px); letter-spacing:-.045em; line-height:1; }
    .sub { color:var(--muted); margin-top:10px; font-size:14px; }
    .periods { display:flex; gap:8px; }
    button { border:1px solid var(--line); background:#0b1829; color:var(--muted); border-radius:12px; padding:10px 15px; cursor:pointer; font:700 13px/1 Inter,system-ui,sans-serif; transition:border-color .2s,color .2s,background .2s; }
    button:hover { border-color:#375674; color:var(--text); }
    button.active { border-color:var(--accent); background:rgba(93,213,255,.1); color:var(--accent); }
    .summary { display:flex; align-items:center; gap:10px; min-height:44px; margin-bottom:14px; padding:11px 14px; border:1px solid rgba(93,213,255,.2); background:rgba(93,213,255,.06); border-radius:14px; color:#cceffc; font-size:14px; }
    .summary-dot { width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--accent); box-shadow:0 0 16px var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .card { border:1px solid var(--line); background:rgba(14,28,46,.94); border-radius:18px; padding:20px; box-shadow:0 16px 45px rgba(0,0,0,.14); }
    .metric-label { color:var(--muted); font-size:13px; line-height:1.35; }
    .metric-value { margin-top:9px; font-size:32px; font-weight:800; letter-spacing:-.045em; line-height:1; }
    .metric-note { margin-top:9px; color:var(--muted); font-size:12px; line-height:1.45; }
    section { margin-top:16px; }
    .section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h2 { margin:0; font-size:19px; letter-spacing:-.015em; }
    .section-copy { margin:5px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
    .two { display:grid; grid-template-columns:1.12fr .88fr; gap:16px; }
    .funnel-row { display:grid; grid-template-columns:minmax(170px,1.1fr) 2.4fr 44px; gap:12px; align-items:center; margin:13px 0; font-size:14px; }
    .bar { height:10px; background:#14273d; border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--ok)); border-radius:inherit; }
    .retention { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    .retention div { padding:15px; border:1px solid var(--line); background:rgba(7,17,31,.32); border-radius:14px; }
    .retention strong { display:block; font-size:26px; margin-top:7px; letter-spacing:-.04em; }
    .retention-note { margin-top:14px; color:var(--muted); font-size:12px; line-height:1.5; }
    .chart { height:210px; display:flex; flex-direction:column; overflow:hidden; }
    .chart-bars { min-height:0; flex:1; display:grid; grid-template-columns:repeat(var(--day-count),minmax(2px,1fr)); align-items:end; gap:clamp(2px,.55vw,7px); border-bottom:1px solid var(--line); }
    .chart-column { height:100%; display:flex; align-items:flex-end; justify-content:center; min-width:0; }
    .chart-bar { position:relative; width:min(100%,28px); min-height:3px; background:linear-gradient(180deg,var(--accent),#3478f6); border-radius:6px 6px 2px 2px; opacity:.92; }
    .chart-bar.has-shifts::after { content:''; position:absolute; top:6px; left:50%; width:5px; height:5px; transform:translateX(-50%); border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }
    .chart-axis { display:flex; justify-content:space-between; padding-top:10px; color:var(--muted); font-size:11px; }
    .empty { display:grid; place-items:center; min-height:150px; color:var(--muted); font-size:14px; }
    .usage { display:grid; gap:14px; }
    .usage-row { display:grid; grid-template-columns:minmax(190px,1.35fr) 2fr minmax(120px,.8fr); align-items:center; gap:16px; }
    .usage-title { font-size:14px; font-weight:650; }
    .usage-count { color:var(--muted); font-size:12px; text-align:right; white-space:nowrap; }
    .usage-bar { height:8px; overflow:hidden; background:#14273d; border-radius:99px; }
    .usage-bar i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#3478f6,var(--accent)); }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:12px 8px; border-bottom:1px solid var(--line); text-align:left; font-size:13px; }
    th { color:var(--muted); font-weight:600; }
    tbody tr:last-child td { border-bottom:0; }
    .user-id { color:#b9d5e8; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .badge { display:inline-flex; align-items:center; padding:4px 8px; border-radius:99px; font-size:11px; font-weight:700; }
    .badge.active { color:var(--ok); background:rgba(100,230,167,.1); }
    .badge.cooling { color:var(--warn); background:rgba(255,203,107,.1); }
    .badge.churned { color:var(--danger); background:rgba(255,139,152,.1); }
    .table-wrap { overflow-x:auto; }
    .event-props { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11px; white-space:nowrap; }
    details.technical { margin-top:16px; border:1px solid var(--line); background:rgba(10,23,48,.55); border-radius:18px; }
    details.technical > summary { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px; cursor:pointer; list-style:none; color:var(--muted); font-size:14px; }
    details.technical > summary::-webkit-details-marker { display:none; }
    details.technical > summary::after { content:'Показать'; color:var(--accent); font-size:12px; font-weight:700; }
    details.technical[open] > summary::after { content:'Скрыть'; }
    .technical-body { padding:0 20px 20px; }
    .technical-body h3 { margin:18px 0 8px; font-size:15px; }
    .status { color:var(--muted); padding:22px 0; }
    .error { color:var(--danger); }
    @media (max-width:850px) { .grid { grid-template-columns:repeat(2,1fr); } .two { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } .periods { width:100%; } .periods button { flex:1; } }
    @media (max-width:600px) { main { width:min(100% - 24px,1120px); padding-top:18px; } .topline { margin-bottom:22px; } .grid { gap:9px; } .card { padding:15px; border-radius:15px; } .metric-value { font-size:26px; } .funnel-row { grid-template-columns:1fr 42px; gap:7px 10px; } .funnel-row .bar { grid-column:1 / -1; grid-row:2; } .retention { gap:7px; } .retention div { padding:12px 9px; } .retention strong { font-size:21px; } .usage-row { grid-template-columns:1fr auto; gap:6px 12px; } .usage-bar { grid-column:1 / -1; } .chart { height:180px; } .users-wrap { overflow:visible; } .users-table th:nth-child(2),.users-table td:nth-child(2) { display:none; } .users-table th,.users-table td { padding:10px 5px; font-size:11px; } details.technical > summary { padding:16px; } .technical-body { padding:0 16px 16px; } }
  </style>
</head>
<body>
  <main>
    <div class="topline"><a class="back" href="/">← Вернуться в приложение</a></div>
    <header>
      <div><h1>Статистика приложения</h1><div class="sub" id="updated">Загрузка данных…</div></div>
      <div class="periods"><button data-days="7">7 дней</button><button class="active" data-days="30">30 дней</button><button data-days="90">90 дней</button></div>
    </header>
    <div id="content" class="status">Собираю показатели…</div>
  </main>
  <script>
    (function() {
      var activeDays = 30;
      var content = document.getElementById('content');
      var updated = document.getElementById('updated');
      function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]; }); }
      function num(value) { return new Intl.NumberFormat('ru-RU').format(Number(value) || 0); }
      function plural(value, forms) {
        var number = Math.abs(Number(value) || 0) % 100;
        var last = number % 10;
        if (number > 10 && number < 20) return forms[2];
        if (last === 1) return forms[0];
        if (last > 1 && last < 5) return forms[1];
        return forms[2];
      }
      function eventLabel(name) {
        var labels = {
          app_opened:'Запуски приложения', screen_viewed:'Переходы по разделам', shift_form_started:'Начали заполнять смену',
          shift_form_field_used:'Заполняли поля смены', shift_form_abandoned:'Не закончили смену', shift_form_validation_failed:'Ошибки в форме смены',
          shift_saved:'Сохранили смену', first_shift_saved:'Сохранили первую смену', third_shift_saved:'Сохранили третью смену',
          shift_edited:'Изменили смену', shift_deleted:'Удалили смену', shift_sync_failed:'Ошибка синхронизации смены',
          salary_opened:'Открыли расчёт зарплаты', salary_params_changed:'Изменили параметры зарплаты', docs_opened:'Открыли документы',
          partner_invite_created:'Создали приглашение напарнику', partner_connected:'Подключили напарника', shift_shared:'Поделились сменой',
          poekhali_opened:'Открыли «Поехали»', poekhali_started:'Запустили «Поехали»', gps_permission_result:'Ответ на запрос геолокации',
          poekhali_error:'Ошибка в «Поехали»', paywall_viewed:'Увидели предложение подписки', subscription_started:'Начали оформление подписки',
          payment_succeeded:'Успешная оплата', payment_failed:'Ошибка оплаты', session_started:'Начало сессии', session_heartbeat:'Активность в сессии', session_ended:'Завершение сессии'
        };
        return labels[name] || name;
      }
      function shortDate(value) {
        var date = new Date(value);
        return Number.isFinite(date.getTime()) ? date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) : '—';
      }
      function dateTime(value) {
        var date = new Date(value);
        return Number.isFinite(date.getTime()) ? date.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
      }
      function metric(label, value, note) { return '<div class="card"><div class="metric-label">' + esc(label) + '</div><div class="metric-value">' + esc(value) + '</div><div class="metric-note">' + esc(note || '') + '</div></div>'; }
      function retentionCard(label, value, eligible) {
        return '<div><span class="metric-label">' + esc(label) + '</span><strong>' + (eligible ? esc(num(value) + '%') : '—') + '</strong><span class="metric-note">' + (eligible ? esc('из ' + num(eligible)) : 'мало данных') + '</span></div>';
      }
      function authHeaders() {
        var headers = { Accept:'application/json' };
        try {
          var token = localStorage.getItem('shift_tracker_session_token') || '';
          if (token) headers.Authorization = 'Bearer ' + token;
        } catch (error) {}
        return headers;
      }
      function render(data) {
        var m = data.metrics || {};
        var maxFunnel = Math.max.apply(Math, (data.funnel || []).map(function(row) { return row.users || 0; }).concat([1]));
        var maxDaily = Math.max.apply(Math, (data.daily || []).map(function(row) { return row.users || 0; }).concat([1]));
        var retention = data.retention || {};
        var eligible = retention.eligible || {};
        var funnel = (data.funnel || []).map(function(row) {
          return '<div class="funnel-row"><span>' + esc(row.label) + '</span><div class="bar"><i style="width:' + Math.max(2,Math.round((row.users || 0)*100/maxFunnel)) + '%"></i></div><strong>' + num(row.users) + '</strong></div>';
        }).join('');
        var dailyRows = data.daily || [];
        var daily = dailyRows.map(function(row) {
          var height = Math.max(3,Math.round((row.users || 0)*100/maxDaily));
          var title = shortDate(row.day) + ': ' + num(row.users) + ' ' + plural(row.users,['пользователь','пользователя','пользователей']) + ', ' + num(row.shifts) + ' ' + plural(row.shifts,['смена','смены','смен']);
          return '<div class="chart-column" title="' + esc(title) + '"><i class="chart-bar' + (row.shifts ? ' has-shifts' : '') + '" style="height:' + height + '%"></i></div>';
        }).join('');
        var axis = '';
        if (dailyRows.length) {
          var middle = dailyRows[Math.floor((dailyRows.length - 1) / 2)];
          axis = '<div class="chart-axis"><span>' + esc(shortDate(dailyRows[0].day)) + '</span>' + (dailyRows.length > 1 ? '<span>' + esc(shortDate(middle.day)) + '</span><span>' + esc(shortDate(dailyRows[dailyRows.length - 1].day)) + '</span>' : '') + '</div>';
        }
        var productEvents = (data.events || []).filter(function(row) { return row.eventName !== 'session_started' && row.eventName !== 'session_heartbeat' && row.eventName !== 'session_ended'; });
        var maxUsage = Math.max.apply(Math, productEvents.map(function(row) { return row.events || 0; }).concat([1]));
        var usage = productEvents.slice(0,10).map(function(row) {
          return '<div class="usage-row"><div class="usage-title">' + esc(eventLabel(row.eventName)) + '</div><div class="usage-bar"><i style="width:' + Math.max(3,Math.round((row.events || 0)*100/maxUsage)) + '%"></i></div><div class="usage-count">' + num(row.events) + ' ' + plural(row.events,['действие','действия','действий']) + ' · ' + num(row.users) + ' ' + plural(row.users,['человек','человека','человек']) + '</div></div>';
        }).join('');
        var users = (data.users || []).slice(0,12).map(function(row) {
          var lifecycle = row.lifecycle === 'active' ? 'Активен' : row.lifecycle === 'cooling' ? 'Давно не заходил' : row.lifecycle === 'churned' ? 'Не возвращается' : 'Нет данных';
          var badgeClass = row.lifecycle === 'active' || row.lifecycle === 'cooling' || row.lifecycle === 'churned' ? row.lifecycle : 'cooling';
          return '<tr><td class="user-id">#' + esc(String(row.userKey || '').slice(0,6)) + '</td><td>' + esc(dateTime(row.lastSeenAt)) + '</td><td><span class="badge ' + esc(badgeClass) + '">' + esc(lifecycle) + '</span></td><td>' + num(row.sessions) + '</td><td>' + num(row.shifts) + '</td></tr>';
        }).join('');
        var recentEvents = (data.recentEvents || []).map(function(row) {
          return '<tr><td>' + esc(dateTime(row.occurredAt)) + '</td><td class="user-id">#' + esc(String(row.userKey || '').slice(0,6)) + '</td><td>' + esc(eventLabel(row.eventName)) + '</td><td class="event-props">' + esc(JSON.stringify(row.properties || {})) + '</td></tr>';
        }).join('');
        var summary = m.activeUsers ? 'За ' + activeDays + ' дней: ' + num(m.activeUsers) + ' ' + plural(m.activeUsers,['пользователь','пользователя','пользователей']) + ', ' + num(m.sessions) + ' ' + plural(m.sessions,['заход','захода','заходов']) + ' и ' + num(m.shiftsSaved) + ' ' + plural(m.shiftsSaved,['сохранённая смена','сохранённые смены','сохранённых смен']) + '.' : 'За выбранный период активности пока нет.';
        content.className = '';
        content.innerHTML =
          '<div class="summary"><i class="summary-dot"></i><span>' + esc(summary) + '</span></div>' +
          '<div class="grid">' +
            metric('Пользовались приложением', num(m.activeUsers), 'В прошлом таком периоде — ' + num(m.previousActiveUsers)) +
            metric('Открывали сегодня', num(m.dau), 'За 7 дней — ' + num(m.wau) + ' · за 30 — ' + num(m.mau)) +
            metric('Заходы в приложение', num(m.sessions), 'В среднем ' + num(m.averageSessionMinutes) + ' мин за один заход') +
            metric('Сохранено смен', num(m.shiftsSaved), 'Из них первых — ' + num(m.firstShifts)) +
          '</div>' +
          '<section class="two"><div class="card"><div class="section-head"><div><h2>Путь к первой пользе</h2><p class="section-copy">Сколько людей дошли от запуска приложения до сохранения смены</p></div></div>' + funnel + '</div>' +
          '<div class="card"><div class="section-head"><div><h2>Возвращаются ли</h2><p class="section-copy">Доля тех, кто снова открыл приложение</p></div></div><div class="retention">' +
            retentionCard('На следующий день',retention.d1,eligible.d1) + retentionCard('Через неделю',retention.d7,eligible.d7) + retentionCard('Через месяц',retention.d30,eligible.d30) +
          '</div><div class="retention-note">Всего новых пользователей в расчёте: ' + num(retention.cohort) + '. Если стоит «—», нужный срок ещё не прошёл.</div></div></section>' +
          '<section class="card"><div class="section-head"><div><h2>Активность по дням</h2><p class="section-copy">Высота столбца — сколько людей открывали приложение; зелёная точка — была сохранена смена</p></div></div>' + (daily ? '<div class="chart" style="--day-count:' + Math.max(1,dailyRows.length) + '"><div class="chart-bars">' + daily + '</div>' + axis + '</div>' : '<div class="empty">За этот период событий пока нет</div>') + '</section>' +
          '<section class="card"><div class="section-head"><div><h2>Что используют</h2><p class="section-copy">Самые частые действия внутри приложения</p></div></div><div class="usage">' + (usage || '<div class="empty">Данных пока нет</div>') + '</div></section>' +
          '<section class="card"><div class="section-head"><div><h2>Последние пользователи</h2><p class="section-copy">Кто заходил недавно и сохранял ли смены</p></div><span class="metric-note">Показано ' + num(Math.min(12,(data.users || []).length)) + ' из ' + num((data.users || []).length) + '</span></div><div class="table-wrap users-wrap"><table class="users-table"><thead><tr><th>Пользователь</th><th>Последняя активность</th><th>Статус</th><th>Заходы</th><th>Смены</th></tr></thead><tbody>' + users + '</tbody></table></div></section>' +
          '<details class="technical"><summary><span>Технические события — нужны только для проверки работы статистики</span></summary><div class="technical-body"><h3>Последние события</h3><div class="table-wrap"><table><thead><tr><th>Время</th><th>Пользователь</th><th>Действие</th><th>Параметры</th></tr></thead><tbody>' + recentEvents + '</tbody></table></div></div></details>';
        updated.textContent = 'Данные за ' + activeDays + ' дней · обновлено ' + dateTime(data.generatedAt) + (m.syncErrors ? ' · ошибок синхронизации: ' + num(m.syncErrors) : '');
      }
      function load() {
        content.className = 'status'; content.textContent = 'Собираю показатели…';
        fetch('/api/admin/analytics?days=' + activeDays, { credentials:'same-origin', headers:authHeaders() })
          .then(function(response) {
            if (!response.ok) {
              if (response.status === 401) throw new Error('Сессия не найдена. Откройте приложение и войдите.');
              if (response.status === 403) throw new Error('Нет доступа к аналитике');
              throw new Error('Ошибка загрузки: ' + response.status);
            }
            return response.json();
          })
          .then(render)
          .catch(function(error) {
            content.className = 'status error';
            content.innerHTML = esc(error.message || 'Не удалось загрузить аналитику') + '<br><br><a href="/" style="color:var(--accent)">Открыть приложение и войти</a>';
          });
      }
      document.querySelectorAll('[data-days]').forEach(function(button) { button.addEventListener('click', function() { activeDays = Number(button.dataset.days) || 30; document.querySelectorAll('[data-days]').forEach(function(item) { item.classList.toggle('active', item === button); }); load(); }); });
      load();
    })();
  </script>
</body>
</html>
