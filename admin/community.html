<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Управление сообществом · Блокнот машиниста</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--card:#0e1c2e;--line:#1e334c;--text:#f4f7fb;--muted:#91a3b8;--accent:#5dd5ff;--ok:#64e6a7;--warn:#ffcb6b;--danger:#ff8b98}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#102b4a 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    main{width:min(1240px,calc(100% - 32px));margin:auto;padding:26px 0 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:var(--muted);text-decoration:none;font-size:13px}.nav a:hover{color:var(--text)}h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:-.045em}.sub{margin-top:8px;color:var(--muted);font-size:13px}
    .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.metric,.panel{border:1px solid var(--line);border-radius:17px;background:rgba(14,28,46,.94)}.metric{padding:17px}.metric strong{display:block;margin-top:7px;font-size:28px}.metric span{color:var(--muted);font-size:12px}.panel{margin-top:14px;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}h2{margin:0;font-size:18px}.hint{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#b9d5e8}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:rgba(93,213,255,.1);color:var(--accent);font-weight:700;font-size:10px}.badge.verified,.badge.accepted,.badge.closed{color:var(--ok);background:rgba(100,230,167,.1)}.badge.disputed,.badge.needs_info,.badge.voting{color:var(--warn);background:rgba(255,203,107,.1)}
    button{border:1px solid var(--line);border-radius:10px;background:#0b1829;color:var(--accent);padding:8px 10px;cursor:pointer;font:700 11px/1.2 Inter,system-ui,sans-serif}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty,.status{padding:20px;color:var(--muted);text-align:center}.error{color:var(--danger)}
    @media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){main{width:min(100% - 20px,1240px)}.metrics{grid-template-columns:1fr 1fr}.metric strong{font-size:23px}.panel{padding:13px}}
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div class="nav"><a href="/">← Приложение</a><a href="/analytics">Статистика и документы</a></div>
      <button id="refresh" type="button">Обновить</button>
    </div>
    <h1>Управление сообществом</h1>
    <div class="sub" id="updated">Дороги, депо, предложения, проверяющие и выборы кураторов</div>
    <div id="content" class="status">Загружаю данные…</div>
  </main>
  <script>
    (function(){
      var content=document.getElementById('content');
      var updated=document.getElementById('updated');
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
      function headers(json){var h={Accept:'application/json'};try{var t=localStorage.getItem('shift_tracker_session_token')||'';if(t)h.Authorization='Bearer '+t}catch(e){}if(json)h['Content-Type']='application/json';return h}
      function api(path,options){var opts=options||{};opts.credentials='same-origin';opts.headers=Object.assign(headers(!!opts.body),opts.headers||{});return fetch(path,opts).then(function(r){return r.json().catch(function(){return{}}).then(function(body){if(!r.ok)throw new Error(body.error||('HTTP '+r.status));return body})})}
      function metric(label,value){return '<div class="metric"><span>'+esc(label)+'</span><strong>'+esc(value||0)+'</strong></div>'}
      function badge(value){return '<span class="badge '+esc(value)+'">'+esc(value||'—')+'</span>'}
      function render(data){
        var m=data.metrics||{};
        var memberships=(data.memberships||[]).map(function(x){return '<tr><td class="mono">'+esc(x.sid)+'</td><td>'+esc(x.railwayId||'')+'<br>'+esc(x.depotId||x.scopeKey)+'</td><td>'+badge(x.status)+'</td><td>'+esc(x.role)+'</td><td><div class="actions"><button data-member="'+esc(x.sid)+'" data-scope="'+esc(x.scopeLevel)+'" data-key="'+esc(x.scopeKey)+'" data-road="'+esc(x.railwayId)+'" data-depot="'+esc(x.depotId)+'" data-arm="'+esc(x.serviceArmId)+'" data-role="member">Подтвердить</button><button data-member="'+esc(x.sid)+'" data-scope="'+esc(x.scopeLevel)+'" data-key="'+esc(x.scopeKey)+'" data-road="'+esc(x.railwayId)+'" data-depot="'+esc(x.depotId)+'" data-arm="'+esc(x.serviceArmId)+'" data-role="reviewer">Сделать проверяющим</button></div></td></tr>'}).join('');
        var proposals=(data.proposals||[]).map(function(x){return '<tr><td>'+esc(x.title)+'</td><td>'+esc(x.kind)+'</td><td>'+esc(x.scope&&x.scope.key)+'</td><td>'+badge(x.riskLevel)+'</td><td>'+badge(x.status)+'</td><td>'+new Date(x.updatedAt).toLocaleString('ru-RU')+'</td></tr>'}).join('');
        var elections=(data.elections||[]).map(function(x){var actions=x.status==='nominations'?'<button data-election="'+esc(x.id)+'" data-status="voting">Открыть голосование</button>':x.status==='voting'?'<button data-election="'+esc(x.id)+'" data-status="closed">Завершить</button>':'';if(x.status!=='closed'&&x.status!=='cancelled')actions+='<button data-election="'+esc(x.id)+'" data-status="cancelled">Отменить</button>';return '<tr><td class="mono">'+esc(x.id)+'</td><td>'+esc(x.scopeKey)+'</td><td>'+badge(x.status)+'</td><td>'+esc((x.candidates||[]).length)+'</td><td>'+esc(x.quorum)+'</td><td><div class="actions">'+actions+'</div></td></tr>'}).join('');
        content.className='';
        content.innerHTML='<div class="metrics">'+metric('Участников',m.memberships)+metric('Подтверждены',m.verifiedMembers)+metric('Предложений',m.proposals)+metric('На проверке',m.openProposals)+metric('Выборов',m.elections)+'</div>'+panel('Участники и полномочия','Администратор подтверждает принадлежность к депо. Кураторы назначаются результатом выборов.','<table><thead><tr><th>Пользователь</th><th>Область</th><th>Статус</th><th>Роль</th><th>Действия</th></tr></thead><tbody>'+memberships+'</tbody></table>')+panel('Предложения изменений','Повышение скорости остаётся отдельным риском и требует приказа и усиленного кворума.','<table><thead><tr><th>Изменение</th><th>Тип</th><th>Область</th><th>Риск</th><th>Статус</th><th>Обновлено</th></tr></thead><tbody>'+proposals+'</tbody></table>')+panel('Выборы кураторов','Несколько мест, фиксированный срок и кворум. Голоса до закрытия не публикуются.','<table><thead><tr><th>Выборы</th><th>Область</th><th>Статус</th><th>Кандидатов</th><th>Кворум</th><th>Действия</th></tr></thead><tbody>'+elections+'</tbody></table>');
        updated.textContent='Обновлено '+new Date(data.generatedAt||Date.now()).toLocaleString('ru-RU')+' · дорог '+(data.catalog&&data.catalog.railways||0)+' · депо '+(data.catalog&&data.catalog.depots||0);
      }
      function panel(title,hint,table){return '<section class="panel"><div class="panel-head"><div><h2>'+esc(title)+'</h2><p class="hint">'+esc(hint)+'</p></div></div><div class="table-wrap">'+table+'</div></section>'}
      function load(){content.className='status';content.textContent='Загружаю данные…';return api('/api/admin/community').then(render).catch(function(e){content.className='status error';content.textContent=e.message})}
      content.addEventListener('click',function(event){var b=event.target.closest('button');if(!b)return;if(b.dataset.member){b.disabled=true;api('/api/admin/community/memberships',{method:'PATCH',body:JSON.stringify({sid:b.dataset.member,scopeLevel:b.dataset.scope,railwayId:b.dataset.road,depotId:b.dataset.depot,serviceArmId:b.dataset.arm,status:'verified',role:b.dataset.role})}).then(load).catch(function(e){alert(e.message);b.disabled=false})}else if(b.dataset.election){b.disabled=true;api('/api/admin/community/elections/'+encodeURIComponent(b.dataset.election),{method:'PATCH',body:JSON.stringify({status:b.dataset.status})}).then(load).catch(function(e){alert(e.message);b.disabled=false})}});
      document.getElementById('refresh').addEventListener('click',load);load();
    })();
  </script>
</body>
</html>
